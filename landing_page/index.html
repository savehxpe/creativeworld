<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outworld Creative — Video + Brand Sound</title>
    <meta name="description" content="Outworld Creative creates short-form video ads, brand sounds, and campaign concepts for brands that need people to stop scrolling.">
    <meta property="og:title" content="Outworld Creative — Video + Brand Sound">
    <meta property="og:description" content="Short-form ads, brand sound, jingles, and campaign direction for brands that need people to stop scrolling.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://outworldcreative.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
    <!-- Framer Motion v11.11.17 UMD already exports window.Motion directly -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500;1,9..40,700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

        .liquid-glass {
            background: rgba(255,255,255,0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: "";
            position: absolute; inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%,
                rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%,
                rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .liquid-glass-strong {
            background: rgba(255,255,255,0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: none;
            box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass-strong::before {
            content: "";
            position: absolute; inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.5) 0%,
                rgba(255,255,255,0.2) 20%,
                rgba(255,255,255,0) 40%,
                rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.2) 80%,
                rgba(255,255,255,0.5) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .logo-marquee {
            animation: marqueeScroll 25s linear infinite;
            width: max-content;
        }
        @keyframes marqueeScroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .logo-marquee:hover { animation-play-state: paused; }

        .marquee-fade-l, .marquee-fade-r {
            position: absolute; top: 0; bottom: 0; width: 60px; z-index: 2; pointer-events: none;
        }
        .marquee-fade-l { left: 0; background: linear-gradient(to right, #000, transparent); }
        .marquee-fade-r { right: 0; background: linear-gradient(to left, #000, transparent); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
            .logo-marquee { animation: none; }
            .hero-bg-img { animation: none; }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"DM Sans"', 'system-ui', 'sans-serif'],
                        body: ['system-ui', '-apple-system', 'sans-serif'],
                    },
                    borderRadius: { DEFAULT: '9999px' },
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { createRoot } = ReactDOM;
        const { useState, useEffect, useRef, useCallback, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        function FadingVideo({ src, poster, className, style, children }) {
            const videoRef = useRef(null);
            const imgRef = useRef(null);
            const rafRef = useRef(null);
            const fadingOutRef = useRef(false);
            const [useVideo, setUseVideo] = useState(false);
            const [loaded, setLoaded] = useState(false);

            const fadeTo = useCallback((el, target, duration) => {
                if (rafRef.current) cancelAnimationFrame(rafRef.current);
                const start = parseFloat(el.style.opacity || 0);
                const startTime = performance.now();
                return new Promise(resolve => {
                    const tick = (now) => {
                        const elapsed = (now - startTime) / (duration * 1000);
                        const progress = Math.min(elapsed, 1);
                        el.style.opacity = start + (target - start) * progress;
                        if (progress < 1) rafRef.current = requestAnimationFrame(tick);
                        else { el.style.opacity = target; resolve(); }
                    };
                    rafRef.current = requestAnimationFrame(tick);
                });
            }, []);

            const onLoaded = useCallback(async () => {
                if (videoRef.current) {
                    videoRef.current.style.opacity = '0';
                    videoRef.current.play();
                    await fadeTo(videoRef.current, 1, FADE_MS / 1000);
                } else if (imgRef.current) {
                    imgRef.current.style.opacity = '0';
                    await fadeTo(imgRef.current, 1, FADE_MS / 1000);
                }
                setLoaded(true);
            }, [fadeTo]);

            const onTimeUpdate = useCallback(() => {
                const v = videoRef.current;
                if (!v || fadingOutRef.current) return;
                if (v.duration - v.currentTime <= FADE_OUT_LEAD && v.duration - v.currentTime > 0) {
                    fadingOutRef.current = true;
                    fadeTo(v, 0, FADE_OUT_LEAD);
                }
            }, [fadeTo]);

            const onEnded = useCallback(async () => {
                const v = videoRef.current;
                if (!v) return;
                v.style.opacity = '0';
                await new Promise(r => setTimeout(r, 100));
                v.currentTime = 0;
                v.play();
                fadingOutRef.current = false;
                fadeTo(v, 1, FADE_MS / 1000);
            }, [fadeTo]);

            useEffect(() => {
                const v = videoRef.current;
                if (!v) return;
                v.addEventListener('loadeddata', onLoaded);
                v.addEventListener('timeupdate', onTimeUpdate);
                v.addEventListener('ended', onEnded);
                return () => {
                    v.removeEventListener('loadeddata', onLoaded);
                    v.removeEventListener('timeupdate', onTimeUpdate);
                    v.removeEventListener('ended', onEnded);
                    if (rafRef.current) cancelAnimationFrame(rafRef.current);
                };
            }, [onLoaded, onTimeUpdate, onEnded]);

            const tryVideo = useCallback(() => {
                setUseVideo(true);
            }, []);

            useEffect(() => {
                if (imgRef.current && !loaded) {
                    const img = imgRef.current;
                    if (img.complete) {
                        img.style.opacity = '0';
                        fadeTo(img, 1, FADE_MS / 1000).then(() => setLoaded(true));
                    } else {
                        img.addEventListener('load', () => {
                            img.style.opacity = '0';
                            fadeTo(img, 1, FADE_MS / 1000).then(() => setLoaded(true));
                        }, { once: true });
                    }
                }
            }, [fadeTo, loaded]);

            const [showVideoHint, setShowVideoHint] = useState(false);
            useEffect(() => {
                const t = setTimeout(() => setShowVideoHint(true), 3000);
                return () => clearTimeout(t);
            }, []);

            const imgEl = (
                <img ref={imgRef} src={poster || src} alt=""
                    className={`absolute inset-0 w-full h-full object-cover ${className || ''}`}
                    style={{ opacity: 0, ...(style || {}) }}
                    onDoubleClick={tryVideo}
                />
            );

            if (!useVideo) return (
                <div className="absolute inset-0 overflow-hidden">
                    {imgEl}
                    {showVideoHint && poster && (
                        <div className="absolute bottom-4 right-4 text-white/30 text-xs font-body z-10">
                            double-click background to test video mode
                        </div>
                    )}
                </div>
            );

            return (
                <div className="absolute inset-0 overflow-hidden">
                    <video ref={videoRef} src={src} autoPlay muted playsInline loop={false}
                        preload="auto"
                        className={`absolute inset-0 w-full h-full object-cover ${className || ''}`}
                        style={{ opacity: 0, ...(style || {}) }}
                    />
                    {children}
                </div>
            );
        }

        function BlurText({ text, className }) {
            const words = text.split(' ');
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
                }, { threshold: 0.1 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);

            return (
                <p ref={ref} className={className || ''} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}>
                    {words.map((word, i) => (
                        <motion.span key={i} style={{ display: 'inline-block', marginRight: '0.28em' }}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                            animate={visible ? [
                                { filter: 'blur(5px)', opacity: 0.5, y: -5 },
                                { filter: 'blur(0px)', opacity: 1, y: 0 }
                            ] : {}}
                            transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: (i * 100) / 1000 }}
                        >
                            {word}
                        </motion.span>
                    ))}
                </p>
            );
        }

        function Navbar() {
            return (
                <nav className="fixed top-0 inset-x-0 z-50 px-8 lg:px-16 py-4 flex items-center justify-between">
                    <a href="#">
                        <img src="assets/outworld_logo_icon_white.png" alt="Outworld Creative logo"
                            className="h-7 w-auto" id="navLogo"
                        />
                    </a>
                    <div className="hidden md:block">
                        <div className="liquid-glass px-1.5 py-1.5 flex items-center gap-1">
                            <a href="#what-we-do" className="px-3 py-2 text-sm font-medium text-white/90 font-body rounded-full transition-colors hover:text-white">
                                What We Do
                            </a>
                            <a href="#contact" className="px-3 py-2 text-sm font-medium text-white/90 font-body rounded-full transition-colors hover:text-white">
                                Contact
                            </a>
                        </div>
                    </div>
                    <div className="w-12"></div>
                </nav>
            );
        }

        function Hero() {
            return (
                <section className="relative min-h-screen flex flex-col items-center justify-center text-center overflow-hidden">
                    <FadingVideo
                        poster="assets/hero/outworld-african-global-hero.png"
                        src="assets/hero/outworld-african-global-hero.png"
                        className="!absolute !inset-0 !w-[110%] !h-[110%] !-top-[5%] !-left-[5%] object-cover"
                        style={{ filter: 'brightness(0.35)' }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-black/60 to-black/85 z-[1]"></div>
                    <div className="absolute inset-0 z-[2] pointer-events-none opacity-[0.03]"
                        style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")` }}>
                    </div>

                    <div className="relative z-10 flex flex-col items-center px-4 pt-24 max-w-2xl">
                        <motion.h1
                            className="font-heading font-bold italic text-5xl md:text-6xl lg:text-7xl leading-[0.85] tracking-[-0.04em] mb-6"
                            style={{ background: 'linear-gradient(135deg, #fff 0%, #c8a45c 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                            transition={{ duration: 0.8, ease: 'easeOut', delay: 0.2 }}
                        >
                            Outworld Creative
                        </motion.h1>

                        <BlurText
                            text="Video ads and brand sound for brands people remember."
                            className="text-lg md:text-xl text-white/70 font-body font-light max-w-xl leading-snug mb-4"
                        />

                        <motion.p
                            className="text-sm text-white/50 font-body max-w-md mb-8"
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                            transition={{ duration: 0.7, ease: 'easeOut', delay: 1.2 }}
                        >
                            Short ads, campaign visuals and sound for Reels, TikTok and launches.
                        </motion.p>

                        <motion.a
                            href="#contact"
                            className="liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium text-white font-body inline-flex items-center gap-2 transition-all hover:scale-105"
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                            transition={{ duration: 0.7, ease: 'easeOut', delay: 1.5 }}
                        >
                            Request a Creative Diagnosis
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
                        </motion.a>
                    </div>
                </section>
            );
        }

        const LOGOS = [
            "assets/brand/partners/adidas.webp", "assets/brand/partners/sportscene.webp",
            "assets/brand/partners/kfc.webp", "assets/brand/partners/empire.webp",
            "assets/brand/partners/stem.webp", "assets/brand/partners/radical.webp",
            "assets/brand/partners/since-the-80s.webp", "assets/brand/partners/365.webp",
            "assets/brand/appearances/mtv.webp", "assets/brand/appearances/news24.webp",
            "assets/brand/appearances/sabc.webp", "assets/brand/appearances/okayafrica.webp",
            "assets/brand/appearances/channelO.webp", "assets/brand/appearances/trace.webp",
            "assets/brand/appearances/hnhh.webp",
        ];

        function Logos() {
            const items = [...LOGOS, ...LOGOS];
            return (
                <section className="relative py-12 border-y border-white/[0.06] overflow-hidden">
                    <div className="text-center mb-8">
                        <h3 className="text-xs text-white/40 uppercase tracking-[0.15em] font-body font-medium">
                            Trusted across music, culture and media
                        </h3>
                    </div>
                    <div className="relative">
                        <div className="marquee-fade-l"></div>
                        <div className="marquee-fade-r"></div>
                        <div className="logo-marquee flex items-center gap-12 px-4">
                            {items.map((src, i) => (
                                <div key={i} className="flex-shrink-0 h-7 flex items-center opacity-40 hover:opacity-100 transition-opacity"
                                    style={{ filter: 'grayscale(100%) brightness(1.8)' }}>
                                    <img src={src} alt="" className="h-full w-auto max-w-[100px] object-contain"
                                        loading="lazy"
                                        onLoad={e => e.target.style.opacity = '1'}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        const CARDS = [
            { icon: '▸', title: 'Short-form Ads', desc: 'Reels, TikToks and Shorts built around strong hooks.' },
            { icon: '♪', title: 'Brand Sound', desc: 'Jingles, tags and loops people remember.' },
            { icon: '◈', title: 'Campaign Direction', desc: 'Clear ideas for launches, drops and promos.' },
        ];

        function WhatWeDo() {
            const containerVariants = {
                hidden: {},
                visible: { transition: { staggerChildren: 0.2 } }
            };
            const cardVariants = {
                hidden: { filter: 'blur(10px)', opacity: 0, y: 30 },
                visible: { filter: 'blur(0px)', opacity: 1, y: 0, transition: { duration: 0.7, ease: 'easeOut' } }
            };

            return (
                <section id="what-we-do" className="relative py-24 px-8 md:px-16 max-w-4xl mx-auto">
                    <div className="text-center mb-12">
                        <h2 className="font-heading font-bold text-3xl md:text-4xl text-white tracking-[-0.02em]">
                            What We Do
                        </h2>
                    </div>
                    <motion.div
                        className="grid grid-cols-1 md:grid-cols-3 gap-5"
                        variants={containerVariants} initial="hidden" whileInView="visible"
                        viewport={{ once: true, margin: '-50px' }}
                    >
                        {CARDS.map((card, i) => (
                            <motion.div key={i} variants={cardVariants}
                                className="liquid-glass rounded-[1.25rem] p-8 text-center flex flex-col items-center gap-3 transition-transform hover:scale-[1.02]"
                            >
                                <div className="text-2xl opacity-60">{card.icon}</div>
                                <h3 className="font-heading font-bold text-lg text-white">{card.title}</h3>
                                <p className="text-sm text-white/60 font-body font-light leading-relaxed max-w-[24ch]">{card.desc}</p>
                            </motion.div>
                        ))}
                    </motion.div>
                </section>
            );
        }

        function CTA() {
            return (
                <section id="contact" className="relative py-24 px-8 text-center" style={{ background: 'linear-gradient(to bottom, transparent, rgba(200,164,92,0.04))' }}>
                    <h2 className="font-heading font-bold text-3xl md:text-4xl text-white tracking-[-0.02em] mb-4">
                        Want sharper ads?
                    </h2>
                    <p className="text-white/50 font-body mb-6">Request a Creative Diagnosis.</p>
                    <a href="mailto:team@outworldcreative.com"
                        className="inline-block liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium text-white font-body transition-all hover:scale-105"
                    >
                        team@outworldcreative.com
                    </a>
                </section>
            );
        }

        function Footer() {
            return (
                <footer className="text-center py-8 border-t border-white/[0.06]">
                    <p className="text-xs text-white/30 font-body">Founded by saveHXPE — recording artist, producer and creative director.</p>
                    <p className="text-xs text-white/20 font-body mt-1">Outworld Creative. Built from Africa. Designed for the world.</p>
                </footer>
            );
        }

        function App() {
            return (
                <React.Fragment>
                    <Navbar />
                    <Hero />
                    <Logos />
                    <WhatWeDo />
                    <CTA />
                    <Footer />
                </React.Fragment>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
