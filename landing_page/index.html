<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outworld Creative — Video + Brand Sound</title>
    <meta name="description" content="Outworld Creative creates short-form video ads, brand sounds, and campaign concepts for brands that need people to stop scrolling.">
    <meta property="og:title" content="Outworld Creative — Video + Brand Sound">
    <meta property="og:description" content="Short-form ads, brand sound, jingles, and campaign direction for brands that need people to stop scrolling.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://outworldcreative.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500;1,9..40,700&display=swap');

        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

        .liquid-glass {
            background: rgba(255,255,255,0.01); background-blend-mode: luminosity;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: none; box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .liquid-glass::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
            background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }
        .liquid-glass-strong {
            background: rgba(255,255,255,0.01); background-blend-mode: luminosity;
            backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);
            border: none; box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
            position: relative; overflow: hidden;
        }
        .liquid-glass-strong::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
            background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.2) 80%, rgba(255,255,255,0.5) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }

        /* Globe SVG */
        .globe-bg { position: absolute; inset: 0; z-index: 0; opacity: 0.08; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .globe-bg svg { width: 140%; height: auto; min-width: 900px; }
        @media (max-width: 768px) { .globe-bg { opacity: 0.06; } .globe-bg svg { width: 200%; } }

        /* Particles */
        .particles { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .particle {
            position: absolute; width: 2px; height: 2px; border-radius: 50%;
            background: rgba(200,164,92,0.6); animation: float 8s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            25% { transform: translate(30px, -40px) scale(1.5); opacity: 0.6; }
            50% { transform: translate(-20px, -80px) scale(1); opacity: 0.3; }
            75% { transform: translate(-40px, -20px) scale(2); opacity: 0.5; }
        }
        .particle:nth-child(odd) { animation-duration: 10s; animation-delay: 2s; }
        .particle:nth-child(3n) { animation-duration: 7s; animation-delay: 4s; background: rgba(255,255,255,0.3); }
        .particle:nth-child(5n+2) { animation-duration: 12s; animation-delay: 1s; background: rgba(200,164,92,0.3); }

        /* Logo grid */
        .logo-grid-container { position: relative; max-width: 900px; margin: 0 auto; }
        .logo-grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem; align-items: center; justify-items: center;
            padding: 2rem 1rem;
        }
        .logo-grid-item {
            height: 36px; opacity: 0.6; filter: grayscale(100%) brightness(1.8);
            transition: opacity 0.4s, filter 0.4s; cursor: default;
        }
        .logo-grid-item:hover { opacity: 1; filter: grayscale(0%) brightness(1); }
        .logo-grid-item img { height: 100%; width: auto; max-width: 100px; object-fit: contain; }
        @media (max-width: 768px) { .logo-grid { grid-template-columns: repeat(3, 1fr); gap: 1rem; } .logo-grid-item { height: 24px; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
            .particle { animation: none; opacity: 0.2; }
            .globe-bg svg { animation: none; }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"DM Sans"', 'system-ui', 'sans-serif'],
                        body: ['system-ui', '-apple-system', 'sans-serif'],
                    },
                    borderRadius: { DEFAULT: '9999px' },
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { createRoot } = ReactDOM;
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion } = window.Motion;

        function FadingImage({ src, className, style }) {
            const imgRef = useRef(null);
            useEffect(() => {
                const img = imgRef.current;
                if (!img) return;
                if (img.complete) { img.style.opacity = '0'; requestAnimationFrame(() => { img.style.transition = 'opacity 0.5s'; img.style.opacity = '1'; }); }
                else { img.addEventListener('load', () => { img.style.opacity = '0'; requestAnimationFrame(() => { img.style.transition = 'opacity 0.5s'; img.style.opacity = '1'; }); }, { once: true }); }
            }, []);
            return <img ref={imgRef} src={src} alt="" className={className} style={{ opacity: 0, ...(style || {}) }} />;
        }

        function BlurText({ text, className }) {
            const words = text.split(' ');
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const obs = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold: 0.1 });
                obs.observe(el);
                return () => obs.disconnect();
            }, []);
            return (
                <p ref={ref} className={className || ''} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}>
                    {words.map((word, i) => (
                        <motion.span key={i} style={{ display: 'inline-block', marginRight: '0.28em' }}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                            animate={visible ? [{ filter: 'blur(5px)', opacity: 0.5, y: -5 }, { filter: 'blur(0px)', opacity: 1, y: 0 }] : {}}
                            transition={{ duration: 0.7, times: [0, 0.5, 1], ease: 'easeOut', delay: (i * 100) / 1000 }}
                        >{word}</motion.span>
                    ))}
                </p>
            );
        }

        function Navbar() {
            return (
                <nav className="fixed top-0 inset-x-0 z-50 px-8 lg:px-16 py-4 flex items-center justify-between">
                    <a href="#"><img src="assets/outworld_logo_icon_white.png" alt="Outworld Creative logo" className="h-7 w-auto" id="navLogo"/></a>
                    <div className="hidden md:block">
                        <div className="liquid-glass px-1.5 py-1.5 flex items-center gap-1">
                            <a href="#what-we-do" className="px-3 py-2 text-sm font-medium text-white/90 font-body rounded-full transition-colors hover:text-white">What We Do</a>
                            <a href="#contact" className="px-3 py-2 text-sm font-medium text-white/90 font-body rounded-full transition-colors hover:text-white">Contact</a>
                        </div>
                    </div>
                    <div className="w-12"></div>
                </nav>
            );
        }

        function Globe() {
            return (
                <div className="globe-bg">
                    <svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" style={{ animation: 'spin 60s linear infinite' }}>
                        <defs>
                            <radialGradient id="gg" cx="50%" cy="50%"><stop offset="0%" stopColor="rgba(200,164,92,0.6)"/><stop offset="100%" stopColor="rgba(200,164,92,0)"/></radialGradient>
                        </defs>
                        <ellipse cx="600" cy="300" rx="400" ry="180" fill="none" stroke="rgba(200,164,92,0.3)" strokeWidth="0.8" />
                        <ellipse cx="600" cy="300" rx="250" ry="250" fill="none" stroke="rgba(255,255,255,0.15)" strokeWidth="0.5" />
                        <ellipse cx="600" cy="300" rx="150" ry="300" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="0.5" />
                        <ellipse cx="600" cy="300" rx="300" ry="120" fill="none" stroke="rgba(200,164,92,0.2)" strokeWidth="0.6" />
                        <path d="M200 300 Q400 200 600 300 Q800 400 1000 300" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="0.5" />
                        <path d="M200 300 Q400 400 600 300 Q800 200 1000 300" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="0.5" />
                        <circle cx="480" cy="260" r="3" fill="rgba(200,164,92,0.8)" />
                        <circle cx="520" cy="340" r="2" fill="rgba(200,164,92,0.6)" />
                        <circle cx="650" cy="280" r="2.5" fill="rgba(255,255,255,0.5)" />
                        <circle cx="720" cy="320" r="2" fill="rgba(200,164,92,0.5)" />
                        <circle cx="400" cy="290" r="2" fill="rgba(255,255,255,0.4)" />
                        <circle cx="580" cy="310" r="2" fill="rgba(200,164,92,0.7)" />
                        <circle cx="680" cy="270" r="1.5" fill="rgba(255,255,255,0.3)" />
                        <circle cx="500" cy="300" r="2" fill="rgba(200,164,92,0.4)" />
                        <circle cx="600" cy="300" r="1.5" fill="rgba(200,164,92,0.9)" />
                    </svg>
                    <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
                </div>
            );
        }

        function Particles() {
            const count = 30;
            return (
                <div className="particles">
                    {Array.from({ length: count }, (_, i) => (
                        <div key={i} className="particle"
                            style={{
                                left: `${Math.random() * 100}%`, top: `${Math.random() * 100}%`,
                                animationDelay: `${Math.random() * 8}s`,
                                width: `${1 + Math.random() * 3}px`, height: `${1 + Math.random() * 3}px`,
                                opacity: 0.2 + Math.random() * 0.4,
                            }}
                        />
                    ))}
                </div>
            );
        }

        function Hero() {
            return (
                <section className="relative min-h-screen flex flex-col items-center justify-center text-center overflow-hidden">
                    <Globe />
                    <Particles />
                    <FadingImage src="assets/hero/outworld-african-global-hero.png"
                        className="absolute inset-0 w-[110%] h-[110%] -top-[5%] -left-[5%] object-cover z-0"
                        style={{ filter: 'brightness(0.25)' }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-b from-black/30 via-black/55 to-black/85 z-[2]"></div>
                    <div className="absolute inset-0 z-[3] pointer-events-none opacity-[0.025]"
                        style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")` }}></div>

                    <div className="relative z-10 flex flex-col items-center px-4 pt-24 max-w-2xl">
                        <motion.h1 className="font-heading font-bold italic text-5xl md:text-6xl lg:text-7xl leading-[0.85] tracking-[-0.04em] mb-6"
                            style={{ background: 'linear-gradient(135deg, #fff 0%, #c8a45c 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                            transition={{ duration: 0.8, ease: 'easeOut', delay: 0.2 }}>
                            Outworld Creative
                        </motion.h1>
                        <BlurText text="Video ads and brand sound for brands people remember."
                            className="text-lg md:text-xl text-white/70 font-body font-light max-w-xl leading-snug mb-4" />
                        <motion.p className="text-sm text-white/50 font-body max-w-md mb-8"
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                            transition={{ duration: 0.7, ease: 'easeOut', delay: 1.2 }}>
                            Short ads, campaign visuals and sound for Reels, TikTok and launches.
                        </motion.p>
                        <motion.a href="#contact" className="liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium text-white font-body inline-flex items-center gap-2 transition-all hover:scale-105"
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 20 }}
                            animate={{ filter: 'blur(0px)', opacity: 1, y: 0 }}
                            transition={{ duration: 0.7, ease: 'easeOut', delay: 1.5 }}>
                            Request a Creative Diagnosis
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
                        </motion.a>
                    </div>
                </section>
            );
        }

        const ALL_LOGOS = [
            { src: "assets/brand/partners/adidas.webp", alt: "Adidas" },
            { src: "assets/brand/partners/sportscene.webp", alt: "Sportscene" },
            { src: "assets/brand/partners/kfc.webp", alt: "KFC" },
            { src: "assets/brand/partners/empire.webp", alt: "Empire" },
            { src: "assets/brand/partners/stem.webp", alt: "STEM" },
            { src: "assets/brand/partners/radical.webp", alt: "Radical" },
            { src: "assets/brand/partners/since-the-80s.webp", alt: "SinceThe80s" },
            { src: "assets/brand/partners/365.webp", alt: "365" },
            { src: "assets/brand/appearances/mtv.webp", alt: "MTV" },
            { src: "assets/brand/appearances/news24.webp", alt: "News24" },
            { src: "assets/brand/appearances/sabc.webp", alt: "SABC" },
            { src: "assets/brand/appearances/okayafrica.webp", alt: "OkayAfrica" },
            { src: "assets/brand/appearances/channelO.webp", alt: "Channel O" },
            { src: "assets/brand/appearances/trace.webp", alt: "Trace" },
            { src: "assets/brand/appearances/hnhh.webp", alt: "HNHH" },
        ];

        function Logos() {
            return (
                <section className="relative py-16 border-y border-white/[0.06] overflow-hidden">
                    <div className="text-center mb-10">
                        <h3 className="text-xs text-white/40 uppercase tracking-[0.15em] font-body font-medium">
                            Trusted across music, culture and media
                        </h3>
                        <p className="text-[10px] text-white/20 mt-1 font-body">Platforms, partners &amp; appearances</p>
                    </div>
                    <div className="logo-grid-container" id="logoGrid">
                        <div className="logo-grid">
                            {ALL_LOGOS.map((logo, i) => (
                                <div key={i} className="logo-grid-item" id={`logo-${i}`}>
                                    <img src={logo.src} alt={logo.alt} loading="lazy" />
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        }

        const CARDS = [
            { icon: '▸', title: 'Short-form Ads', desc: 'Reels, TikToks and Shorts built around strong hooks.' },
            { icon: '♪', title: 'Brand Sound', desc: 'Jingles, tags and loops people remember.' },
            { icon: '◈', title: 'Campaign Direction', desc: 'Clear ideas for launches, drops and promos.' },
        ];

        function WhatWeDo() {
            const containerVariants = { hidden: {}, visible: { transition: { staggerChildren: 0.2 } } };
            const cardVariants = {
                hidden: { filter: 'blur(10px)', opacity: 0, y: 30 },
                visible: { filter: 'blur(0px)', opacity: 1, y: 0, transition: { duration: 0.7, ease: 'easeOut' } }
            };
            return (
                <section id="what-we-do" className="relative py-24 px-8 md:px-16 max-w-4xl mx-auto">
                    <div className="text-center mb-12">
                        <h2 className="font-heading font-bold text-3xl md:text-4xl text-white tracking-[-0.02em]">What We Do</h2>
                    </div>
                    <motion.div className="grid grid-cols-1 md:grid-cols-3 gap-5"
                        variants={containerVariants} initial="hidden" whileInView="visible" viewport={{ once: true, margin: '-50px' }}>
                        {CARDS.map((card, i) => (
                            <motion.div key={i} variants={cardVariants}
                                className="liquid-glass rounded-[1.25rem] p-8 text-center flex flex-col items-center gap-3 transition-transform hover:scale-[1.02]">
                                <div className="text-2xl opacity-60">{card.icon}</div>
                                <h3 className="font-heading font-bold text-lg text-white">{card.title}</h3>
                                <p className="text-sm text-white/60 font-body font-light leading-relaxed max-w-[24ch]">{card.desc}</p>
                            </motion.div>
                        ))}
                    </motion.div>
                </section>
            );
        }

        function CTA() {
            return (
                <section id="contact" className="relative py-24 px-8 text-center" style={{ background: 'linear-gradient(to bottom, transparent, rgba(200,164,92,0.04))' }}>
                    <h2 className="font-heading font-bold text-3xl md:text-4xl text-white tracking-[-0.02em] mb-4">Want sharper ads?</h2>
                    <p className="text-white/50 font-body mb-6">Request a Creative Diagnosis.</p>
                    <a href="mailto:team@outworldcreative.com" className="inline-block liquid-glass-strong rounded-full px-6 py-3 text-sm font-medium text-white font-body transition-all hover:scale-105">team@outworldcreative.com</a>
                </section>
            );
        }

        function Footer() {
            return (
                <footer className="text-center py-8 border-t border-white/[0.06]">
                    <p className="text-xs text-white/30 font-body">Founded by saveHXPE — recording artist, producer and creative director.</p>
                    <p className="text-xs text-white/20 font-body mt-1">Outworld Creative. Built from Africa. Designed for the world.</p>
                </footer>
            );
        }

        function App() {
            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);
                const mm = gsap.matchMedia();
                mm.add("(min-width: 769px)", () => {
                    gsap.to('.hero-bg-container img', {
                        y: () => window.innerHeight * 0.2,
                        ease: 'none',
                        scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true }
                    });
                    gsap.fromTo('#logoGrid .logo-grid-item', { opacity: 0, scale: 0.8 },
                        { opacity: 0.6, scale: 1, stagger: 0.05, duration: 0.6, ease: 'power2.out',
                            scrollTrigger: { trigger: '#logoGrid', start: 'top 80%' } });
                });
                mm.add("(max-width: 768px)", () => {
                    gsap.fromTo('#logoGrid .logo-grid-item', { opacity: 0 },
                        { opacity: 0.6, stagger: 0.03, duration: 0.4,
                            scrollTrigger: { trigger: '#logoGrid', start: 'top 85%' } });
                });
                return () => {
                    ScrollTrigger.getAll().forEach(t => t.kill());
                    mm.revert();
                };
            }, []);

            return (
                <React.Fragment>
                    <Navbar />
                    <Hero />
                    <Logos />
                    <WhatWeDo />
                    <CTA />
                    <Footer />
                </React.Fragment>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
