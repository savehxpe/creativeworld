    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500;1,9..40,700&display=swap');

        :root {
            --gold: #c9a84c;
            --gold-light: #f0d080;
            --white: #f4f2ee;
            --dim: rgba(244,242,238,0.45);
            --dim-light: rgba(244,242,238,0.3);
            --glass-bg: rgba(255,255,255,0.035);
            --glass-border: rgba(255,255,255,0.08);
            --black: #050505;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--black); color: var(--white); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

        .liquid-glass {
            background: var(--glass-bg); background-blend-mode: luminosity;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: none; box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .liquid-glass::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
            background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* Nav */
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 28px 10vw; background: linear-gradient(to bottom, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0.7) 60%, transparent 100%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .nav-logo-img { height: 28px; width: auto; }
        .nav-right { display: flex; gap: 36px; align-items: center; }
        .nav-right a { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); text-decoration: none; transition: color 0.3s; }
        .nav-right a:hover { color: var(--gold-light); }
        .nav-pill { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid rgba(201,168,76,0.4); color: var(--gold-light); padding: 8px 20px; border-radius: 100px; text-decoration: none; transition: background 0.3s, color 0.3s; }
        .nav-pill:hover { background: var(--gold); color: #000; }

        /* Hero */
        .hero-eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--gold); }
        .btn-primary { display: inline-block; background: var(--gold); color: #000; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; padding: 16px 36px; border-radius: 2px; text-decoration: none; border: none; transition: background 0.3s, transform: 0.2s; }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
        .hero-email { font-size: 11px; letter-spacing: 0.1em; color: var(--dim); }
        .hero-email a { color: var(--gold); text-decoration: none; transition: color 0.3s; }
        .hero-email a:hover { color: var(--gold-light); }
        .scroll-line { width: 40px; height: 1px; background: rgba(201,168,76,0.3); position: relative; overflow: hidden; }
        .scroll-line::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--gold); animation: scrollPulse 2s 2s infinite; }

        /* Section base */
        section { position: relative; z-index: 10; padding: 120px 10vw; }
        section:first-of-type { padding-top: clamp(120px, 14vh, 160px); }
        .section-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 60px; display: flex; align-items: center; gap: 12px; }
        .section-label::before { content: ''; width: 24px; height: 1px; background: var(--gold); }
        .section-title { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: clamp(32px, 4.5vw, 60px); line-height: 1.1; margin-bottom: 16px; }
        .section-title em { font-style: italic; color: var(--gold-light); }

        .h-divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.15), transparent); margin: 0; position: relative; z-index: 10; }

        /* Logo Stage */
        .logo-stage-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-stage {
            width: 280px; height: 280px; margin: 60px auto 40px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .logo-card {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            transition: opacity 550ms ease, transform 550ms ease;
            will-change: transform, opacity; background: none; border: none; cursor: pointer;
        }
        .logo-card img {
            width: 180px; height: auto; max-height: 100px; object-fit: contain; opacity: 0.75;
            transition: opacity 0.3s; decoding: async;
        }
        .logo-card:hover img { opacity: 1; }
        .logo-grid-fallback {
            display: none; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 40px; width: 100%; max-width: 600px;
        }
        .logo-grid-item { padding: 24px; border: 1px solid var(--glass-border); background: var(--glass-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-grid-item img { width: 80px; height: auto; opacity: 0.5; }
        @media (max-width: 768px) { .logo-stage { width: 220px; height: 220px; } .logo-card img { width: 140px; max-height: 80px; } }
        @media (prefers-reduced-motion: reduce) { .logo-grid-fallback { display: grid !important; } .logo-stage { display: none; } }

        /* Proof */
        .proof-real-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 40px; }
        .proof-real-card { position: relative; overflow: hidden; aspect-ratio: 3/4; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); cursor: pointer; transition: border-color 0.4s; }
        .proof-real-card:hover { border-color: rgba(201,168,76,0.3); }
        .proof-real-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94); }
        .proof-real-card:hover img { transform: scale(1.04); }
        .proof-real-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 50%); display: flex; align-items: flex-end; padding: 16px; pointer-events: none; }
        .proof-real-label { font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
        .proof-trust { margin-top: 80px; text-align: center; }
        .proof-trust-label { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim); margin-bottom: 32px; display: block; }
        .proof-trust-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 16px; max-width: 800px; margin: 0 auto; }

        /* Problems */
        .problems-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 40px; }
        .problem-card { padding: 36px 32px; background: var(--glass-bg); border: 1px solid var(--glass-border); transition: border-color 0.3s; }
        .problem-card:hover { border-color: rgba(201,168,76,0.2); }
        .problem-num { font-size: 10px; letter-spacing: 0.2em; color: var(--gold); opacity: 0.6; margin-bottom: 20px; }
        .problem-pain { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 10px; line-height: 1.3; color: var(--white); }
        .problem-solve { font-size: 12px; line-height: 1.7; color: var(--dim); font-weight: 300; }

        /* Deliverables */
        .deliverables-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 40px; }
        .deliverable-card { padding: 36px 28px; background: var(--glass-bg); border: 1px solid var(--glass-border); transition: background 0.4s, border-color 0.4s; display: flex; flex-direction: column; }
        .deliverable-card:hover { background: rgba(255,255,255,0.055); border-color: rgba(201,168,76,0.2); }
        .deliverable-poster { width: 100%; aspect-ratio: 4/5; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; position: relative; overflow: hidden; }
        .deliverable-icon { font-size: 32px; opacity: 0.08; }
        .deliverable-tag { font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
        .deliverable-name { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 10px; line-height: 1.2; }
        .deliverable-desc { font-size: 12px; line-height: 1.7; color: var(--dim); font-weight: 300; }

        /* Services */
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 16px; }
        .service-card { padding: 52px 40px; background: var(--glass-bg); border: 1px solid var(--glass-border); transition: background 0.4s, border-color 0.4s; }
        .service-card:hover { background: rgba(255,255,255,0.055); border-color: rgba(201,168,76,0.2); }
        .service-num { font-size: 11px; letter-spacing: 0.2em; color: var(--gold); opacity: 0.7; margin-bottom: 32px; }
        .service-icon { font-size: 28px; margin-bottom: 20px; opacity: 0.7; }
        .service-name { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 16px; line-height: 1.2; }
        .service-desc { font-size: 13px; line-height: 1.75; color: var(--dim); font-weight: 300; }

        /* CTA */
        .cta-section-inner { text-align: center; }
        .waveform-deco { display: flex; align-items: center; gap: 3px; height: 24px; margin: 0 auto 48px; justify-content: center; }
        .waveform-deco span { display: block; width: 2px; background: linear-gradient(to top, var(--gold), transparent); border-radius: 2px; animation: waveform 1.4s ease-in-out infinite; }
        .cta-headline { font-size: clamp(36px, 5.5vw, 72px); font-weight: 700; line-height: 1.1; max-width: 640px; margin: 0 auto 48px; font-family: 'DM Sans', sans-serif; }
        .cta-headline em { font-style: italic; color: var(--gold-light); }
        .cta-actions { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .cta-email-link { font-size: 13px; letter-spacing: 0.1em; color: var(--dim); text-decoration: none; transition: color 0.3s; }
        .cta-email-link:hover { color: var(--gold); }

        footer { position: relative; z-index: 10; padding: 32px 10vw; border-top: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: 0.14em; color: var(--dim-light); text-transform: uppercase; }

        /* Scroll-scrubbed hero */
        #hero { position: relative; z-index: 10; height: 200vh; }
        .hero-sticky-viewport { position: sticky; top: 0; height: 100svh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hero-scroll-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
        .hero-overlay { position: absolute; inset: 0; z-index: 1; background: radial-gradient(ellipse at center, rgba(5,5,5,0.45) 0%, rgba(5,5,5,0.88) 100%); pointer-events: none; }
        .hero-glimmer { position: absolute; inset: 0; z-index: 1; background: radial-gradient(ellipse at 50% 40%, rgba(201,168,76,0.06) 0%, transparent 70%); animation: glimmerPulse 12s ease-in-out infinite; pointer-events: none; }
        .hero-content { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 10vw; padding-top: clamp(110px, 14vh, 170px); height: 100%; width: 100%; }
        .hero-headline-word { display: inline-block; will-change: transform, opacity; }
        .hero-eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-bottom: 32px; display: flex; align-items: center; justify-content: center; gap: 12px; opacity: 0; animation: fadeUp 1s 0.4s forwards; }
        .hero-headline { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: clamp(52px, 8vw, 100px); line-height: 1.02; letter-spacing: -0.01em; max-width: 800px; text-align: center; opacity: 0; animation: fadeUp 1.1s 0.6s forwards; background: linear-gradient(135deg, var(--white) 0%, var(--gold-light) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-sub { margin-top: 28px; font-size: clamp(15px, 1.6vw, 19px); font-weight: 300; color: var(--dim); max-width: 520px; line-height: 1.65; text-align: center; opacity: 0; animation: fadeUp 1s 0.9s forwards; }
        .hero-micro { margin-top: 14px; font-size: 12px; letter-spacing: 0.06em; color: var(--dim-light); max-width: 420px; line-height: 1.6; text-align: center; opacity: 0; animation: fadeUp 1s 1.1s forwards; }
        .hero-cta { margin-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 12px; opacity: 0; animation: fadeUp 1s 1.3s forwards; }
        .scroll-indicator { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,242,238,0.25); opacity: 0; animation: fadeUp 1s 1.8s forwards; }
        .hero-progress-line { position: fixed; top: 0; left: 0; height: 2px; background: var(--gold); z-index: 200; width: 0%; opacity: 0.6; pointer-events: none; }

        /* Logo stage */
        .logo-stage-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-stage-simple { width: 280px; height: 160px; margin: 60px auto 40px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .logo-stage-simple img { width: 200px; height: auto; max-height: 100px; object-fit: contain; opacity: 0.8; transition: opacity 0.5s, transform 0.5s; }
        .logo-stage-simple img.enter { opacity: 0; transform: scale(1.08); }
        .logo-stage-simple:hover img { opacity: 1; }
        .logo-grid-fallback { display: none; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 16px; margin-top: 40px; width: 100%; max-width: 700px; }
        .logo-grid-item { padding: 24px; border: 1px solid var(--glass-border); background: var(--glass-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-grid-item img { width: 80px; height: auto; opacity: 0.5; }

        /* Animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glimmerPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
        @keyframes scrollPulse { 0% { left: -100%; } 100% { left: 100%; } }
        @keyframes waveform { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.3); } }
        @keyframes logoSpin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.9s cubic-bezier(0.22,1,0.36,1), transform 0.9s cubic-bezier(0.22,1,0.36,1); }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
            .logo-stage-simple { display: none; }
            .logo-grid-fallback { display: grid !important; }
            #bgCanvas { opacity: 0.3; }
            .reveal { opacity: 1; transform: none; transition: none; }
            .hero-progress-line { display: none; }
            .hero-glimmer { animation: none; }
        }

        @media (max-width: 768px) {
            nav { padding: 20px 6vw; }
            .nav-right a:not(.nav-pill) { display: none; }
            section { padding: 80px 6vw; }
            .proof-real-grid, .deliverables-grid, .problems-grid, .services-grid { grid-template-columns: 1fr; }
            footer { flex-direction: column; gap: 12px; text-align: center; }
            .logo-stage-simple { width: 220px; height: 120px; }
            .logo-stage-simple img { width: 140px; max-height: 70px; }
        }
    </style>

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { heading: ['"DM Sans"','system-ui','sans-serif'], body: ['system-ui','-apple-system','sans-serif'] },

                }

        }

<body>
    <canvas id="bgCanvas"></canvas>
    <div id="root"></div>

    <script type="text/babel">
        const { createRoot } = ReactDOM;
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion } = window.Motion;

        function BlurText({ text, className }) {
            const words = text.split(' ');
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current; if (!el) return;
                const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold: 0.1 });
                obs.observe(el); return () => obs.disconnect();
            }, []);
            return <p ref={ref} className={className||''} style={{display:'flex',flexWrap:'wrap',justifyContent:'center',rowGap:'0.1em'}}>
                {words.map((w,i) => <motion.span key={i} style={{display:'inline-block',marginRight:'0.28em'}}
                    initial={{filter:'blur(10px)',opacity:0,y:50}}
                    animate={visible?[{filter:'blur(5px)',opacity:0.5,y:-5},{filter:'blur(0px)',opacity:1,y:0}]:{}}
                    transition={{duration:0.7,times:[0,0.5,1],ease:'easeOut',delay:(i*100)/1000}}>{w}</motion.span>)}
            </p>;
        }

        function Navbar() {
            return <nav>
                <img src="assets/outworld_logo_icon_white.png" alt="Outworld Creative logo" className="nav-logo-img" id="navLogo"
                    style={{ animation: 'logoSpin 24s linear infinite' }} />
                <div className="nav-right">
                    <a href="#logo-stage">Work</a>
                    <a href="#services">Services</a>
                    <a href="#final-cta" className="nav-pill">Start a Project</a>
                </div>
            </nav>;
        }

        function Hero() {
            useEffect(() => {
                const v = document.getElementById('heroVideo');
                if (!v) return;
                const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
                if (prefersReduced.matches) return;
                let targetTime = 0, isSeeking = false;
                const onMeta = () => {
                    targetTime = 0;
                    if (!isSeeking) { isSeeking = true; v.currentTime = 0; }
                };
                const seekTo = () => {
                    if (!v) return;
                    if (Math.abs(v.currentTime - targetTime) > 0.05) {
                        v.currentTime = targetTime;
                    } else {
                        isSeeking = false;
                    }
                };
                const onScroll = () => {
                    const hero = document.getElementById('hero');
                    if (!hero || !v.duration) return;
                    const rect = hero.getBoundingClientRect();
                    const heroHeight = hero.offsetHeight;
                    const viewH = window.innerHeight;
                    const progress = Math.max(0, Math.min(1, (-rect.top) / (heroHeight - viewH)));
                    targetTime = progress * v.duration;
                    const line = document.getElementById('heroProgressLine');
                    if (line) line.style.width = `${progress * 100}%`;
                    if (!isSeeking) {
                        isSeeking = true;
                        requestAnimationFrame(seekTo);
                    }
                    const w1 = document.querySelector('.hero-headline-word-1');
                    const w2 = document.querySelector('.hero-headline-word-2');
                    if (w1 && w2) {
                        w1.style.transform = `translateX(${-progress * 180}px)`;
                        w2.style.transform = `translateX(${progress * 180}px)`;
                        w1.style.letterSpacing = `${progress * 0.12}em`;
                        w2.style.letterSpacing = `${progress * 0.12}em`;
                        w1.style.opacity = Math.max(0.2, 1 - progress * 0.6);
                        w2.style.opacity = Math.max(0.2, 1 - progress * 0.6);
                    }
                };
                v.addEventListener('loadedmetadata', onMeta);
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll, { passive: true });
                v.addEventListener('seeked', () => {
                    if (Math.abs(v.currentTime - targetTime) > 0.05) {
                        v.currentTime = targetTime;
                    } else {
                        isSeeking = false;
                    }
                });
                onScroll();
                return () => {
                    v.removeEventListener('loadedmetadata', onMeta);
                    window.removeEventListener('scroll', onScroll);
                    window.removeEventListener('resize', onScroll);
                };
            }, []);
            return <section id="hero">

    <script>
        /* ── CANVAS LIGHT-PATH BACKGROUND ── */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, mouse = { x: 0, y: 0 };

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);
        document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        class LightPath {
            constructor() { this.reset(); }
            reset() {
                this.x = W * (0.25 + Math.random() * 0.25);
                this.y = H * (0.3 + Math.random() * 0.4);
                this.angle = -Math.PI * (0.1 + Math.random() * 0.4);
                this.speed = 0.6 + Math.random() * 1.2;
                this.life = 0;
                this.maxLife = 220 + Math.random() * 300;
                this.curvature = (Math.random() - 0.5) * 0.018;
                this.width = 0.4 + Math.random() * 1.2;
                this.gold = Math.random() > 0.55;
                this.trail = [];
            }
            update(mouseInfluence) {
                this.angle += this.curvature;
                const pull = mouseInfluence * 0.00008;
                const dx = mouse.x - this.x, dy = mouse.y - this.y;
                if (Math.sqrt(dx * dx + dy * dy) < 300) this.angle += (Math.atan2(dy, dx) - this.angle) * pull;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.trail.push({ x: this.x, y: this.y, life: this.life });
                if (this.trail.length > 80) this.trail.shift();
                this.life++;
                if (this.life > this.maxLife || this.x < -100 || this.x > W + 100 || this.y < -100 || this.y > H + 100) this.reset();
            }
            draw() {
                if (this.trail.length < 2) return;
                const progress = this.life / this.maxLife;
                const fade = progress < 0.15 ? progress / 0.15 : progress > 0.75 ? 1 - (progress - 0.75) / 0.25 : 1;
                ctx.beginPath();
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
                const color = this.gold ? `rgba(180,150,50,${fade * 0.7})` : `rgba(200,195,185,${fade * 0.18})`;
                ctx.strokeStyle = color;
                ctx.lineWidth = this.width * fade;
                ctx.lineCap = 'round';
                ctx.stroke();
                if (this.trail.length > 0) {
                    const tip = this.trail[this.trail.length - 1];
                    const g = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, this.gold ? 8 : 4);
                    if (this.gold) { g.addColorStop(0, `rgba(240,208,128,${fade * 0.9})`); g.addColorStop(1, 'rgba(201,168,76,0)'); }
                    else { g.addColorStop(0, `rgba(220,215,200,${fade * 0.4})`); g.addColorStop(1, 'rgba(220,215,200,0)'); }
                    ctx.beginPath(); ctx.arc(tip.x, tip.y, this.gold ? 8 : 4, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
                }
            }
        }

        class Node {
            constructor() {
                this.x = W * (0.08 + Math.random() * 0.84);
                this.y = H * (0.08 + Math.random() * 0.84);
                this.r = 0.5 + Math.random() * 1.5;
                this.alpha = 0.04 + Math.random() * 0.12;
                this.pulse = Math.random() * Math.PI * 2;
                this.speed = 0.008 + Math.random() * 0.015;
                this.gold = Math.random() > 0.7;
            }
            draw(t) {
                const a = this.alpha * (0.5 + 0.5 * Math.sin(this.pulse + t * this.speed));
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.gold ? `rgba(201,168,76,${a})` : `rgba(200,195,185,${a})`;
                ctx.fill();
            }
        }

        const paths = Array.from({ length: 22 }, () => new LightPath());
        const nodes = Array.from({ length: 60 }, () => new Node());
        let t = 0;

        function drawFrame() {
            ctx.clearRect(0, 0, W, H);
            const vign = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.9);
            vign.addColorStop(0, 'rgba(0,0,0,0)');
            vign.addColorStop(1, 'rgba(0,0,0,0.55)');
            ctx.fillStyle = vign;
            ctx.fillRect(0, 0, W, H);
            const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 280);
            mg.addColorStop(0, 'rgba(201,168,76,0.04)');
            mg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = mg;
            ctx.fillRect(0, 0, W, H);
            nodes.forEach(n => n.draw(t));
            paths.forEach(p => { p.update(1); p.draw(); });
            t++;
            requestAnimationFrame(drawFrame);
        }
        drawFrame();
    </script>
