<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outworld Creative — Video + Brand Sound</title>
    <meta name="description" content="Outworld Creative creates short-form video ads, brand sounds, and campaign concepts for brands that need people to stop scrolling.">
    <meta property="og:title" content="Outworld Creative — Video + Brand Sound">
    <meta property="og:description" content="Short-form ads, brand sound, jingles, and campaign direction for brands that need people to stop scrolling.">

    <meta property="og:image" content="https://outworld.vercel.app/assets/hero/outworld-african-global-hero.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Outworld Creative — Video + Brand Sound">
    <meta name="twitter:description" content="Short-form ads, brand sound, jingles, and campaign direction for brands that need people to stop scrolling.">
    <link rel="canonical" href="https://outworldcreative.com">
    <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Organization","name":"Outworld Creative","url":"https://outworldcreative.com","description":"Video ads and brand sound for brands people remember. Short-form ads, campaign visuals and brand sounds for Reels, TikTok and launch campaigns.","email":"team@outworldcreative.com","founder":{"@type":"Person","name":"saveHXPE","jobTitle":"Recording Artist, Producer & Creative Director"}}
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700;1,9..40,500;1,9..40,700&display=swap');

        :root {
            --gold: #c9a84c;
            --gold-light: #f0d080;
            --white: #f4f2ee;
            --dim: rgba(244,242,238,0.45);
            --dim-light: rgba(244,242,238,0.3);
            --glass-bg: rgba(255,255,255,0.035);
            --glass-border: rgba(255,255,255,0.08);
            --black: #050505;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { background: var(--black); color: var(--white); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }

        .liquid-glass {
            background: var(--glass-bg); background-blend-mode: luminosity;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            border: none; box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .liquid-glass::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
            background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }

        #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        /* Nav */
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 28px 10vw; }
        .nav-logo-img { height: 28px; width: auto; }
        .nav-right { display: flex; gap: 36px; align-items: center; }
        .nav-right a { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); text-decoration: none; transition: color 0.3s; }
        .nav-right a:hover { color: var(--gold-light); }
        .nav-pill { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid rgba(201,168,76,0.4); color: var(--gold-light); padding: 8px 20px; border-radius: 100px; text-decoration: none; transition: background 0.3s, color 0.3s; }
        .nav-pill:hover { background: var(--gold); color: #000; }

        /* Hero */
        #hero { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 0 10vw; }
        .hero-eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); margin-bottom: 32px; display: flex; align-items: center; gap: 12px; opacity: 0; animation: fadeUp 1s 0.4s forwards; }
        .hero-eyebrow::before { content: ''; width: 32px; height: 1px; background: var(--gold); }
        .hero-headline { font-family: 'DM Sans', sans-serif; font-weight: 700; font-style: italic; font-size: clamp(52px, 8vw, 100px); line-height: 1.02; letter-spacing: -0.01em; max-width: 800px; opacity: 0; animation: fadeUp 1.1s 0.6s forwards; background: linear-gradient(135deg, var(--white) 0%, var(--gold-light) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-sub { margin-top: 28px; font-size: clamp(15px, 1.6vw, 19px); font-weight: 300; color: var(--dim); max-width: 520px; line-height: 1.65; opacity: 0; animation: fadeUp 1s 0.9s forwards; }
        .hero-micro { margin-top: 14px; font-size: 12px; letter-spacing: 0.06em; color: var(--dim-light); max-width: 420px; line-height: 1.6; opacity: 0; animation: fadeUp 1s 1.1s forwards; }
        .hero-cta { margin-top: 48px; display: flex; flex-direction: column; gap: 12px; opacity: 0; animation: fadeUp 1s 1.3s forwards; }
        .btn-primary { display: inline-block; background: var(--gold); color: #000; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; padding: 16px 36px; border-radius: 2px; text-decoration: none; border: none; transition: background 0.3s, transform 0.2s; }
        .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
        .hero-email { font-size: 11px; letter-spacing: 0.1em; color: var(--dim); }
        .hero-email a { color: var(--gold); text-decoration: none; transition: color 0.3s; }
        .hero-email a:hover { color: var(--gold-light); }
        .scroll-indicator { position: absolute; bottom: 44px; left: 10vw; display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(244,242,238,0.25); opacity: 0; animation: fadeUp 1s 1.8s forwards; }
        .scroll-line { width: 40px; height: 1px; background: rgba(201,168,76,0.3); position: relative; overflow: hidden; }
        .scroll-line::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--gold); animation: scrollPulse 2s 2s infinite; }

        /* Section base */
        section { position: relative; z-index: 10; padding: 120px 10vw; }
        .section-label { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 60px; display: flex; align-items: center; gap: 12px; }
        .section-label::before { content: ''; width: 24px; height: 1px; background: var(--gold); }
        .section-title { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: clamp(32px, 4.5vw, 60px); line-height: 1.1; margin-bottom: 16px; }
        .section-title em { font-style: italic; color: var(--gold-light); }

        .h-divider { width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,168,76,0.15), transparent); margin: 0; position: relative; z-index: 10; }

        /* Logo Stage */
        .logo-stage-container { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .logo-stage {
            width: 280px; height: 280px; margin: 60px auto 40px;
            border: 1px solid var(--glass-border); background: var(--glass-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .logo-card {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            transition: opacity 550ms ease, transform 550ms ease;
            will-change: transform, opacity; background: none; border: none; cursor: pointer;
        }
        .logo-card img {
            width: 180px; height: auto; max-height: 100px; object-fit: contain; opacity: 0.75;
            transition: opacity 0.3s; decoding: async;
        }
        .logo-card:hover img { opacity: 1; }
        .logo-grid-fallback {
            display: none; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 40px; width: 100%; max-width: 600px;
        }
        .logo-grid-item { padding: 24px; border: 1px solid var(--glass-border); background: var(--glass-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-grid-item img { width: 80px; height: auto; opacity: 0.5; }
        @media (max-width: 768px) { .logo-stage { width: 220px; height: 220px; } .logo-card img { width: 140px; max-height: 80px; } }
        @media (prefers-reduced-motion: reduce) { .logo-grid-fallback { display: grid !important; } .logo-stage { display: none; } }

        /* Proof */
        .proof-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 16px; }
        .proof-card { position: relative; overflow: hidden; aspect-ratio: 9/14; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); cursor: pointer; transition: border-color 0.4s; }
        .proof-card:hover { border-color: rgba(201,168,76,0.3); }
        .proof-card:hover .proof-overlay { opacity: 1; }
        .proof-thumb { width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
        .proof-card:hover .proof-thumb { transform: scale(1.04); }
        .proof-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.4s; }
        .proof-card:hover .proof-thumb img { opacity: 1; }
        .proof-thumb-icon { font-size: 28px; opacity: 0.2; }
        .proof-thumb-lines { width: 60%; display: flex; flex-direction: column; gap: 4px; opacity: 0.08; }
        .proof-thumb-lines span { height: 1px; background: var(--white); display: block; }
        .proof-thumb-lines span:nth-child(2) { width: 70%; }
        .proof-thumb-lines span:nth-child(3) { width: 50%; }
        .proof-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, transparent 55%); opacity: 0; transition: opacity 0.4s; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .proof-label { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
        .proof-desc { font-size: 12px; color: var(--white); line-height: 1.5; opacity: 0.85; }
        .proof-tag { position: absolute; top: 14px; left: 14px; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; background: rgba(0,0,0,0.7); border: 1px solid var(--glass-border); color: var(--dim); padding: 4px 10px; border-radius: 100px; backdrop-filter: blur(8px); }
        .proof-tag.video-tag { border-color: rgba(201,168,76,0.25); color: var(--gold); }

        /* Services */
        .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 16px; }
        .service-card { padding: 52px 40px; background: var(--glass-bg); border: 1px solid var(--glass-border); transition: background 0.4s, border-color 0.4s; }
        .service-card:hover { background: rgba(255,255,255,0.055); border-color: rgba(201,168,76,0.2); }
        .service-num { font-size: 11px; letter-spacing: 0.2em; color: var(--gold); opacity: 0.7; margin-bottom: 32px; }
        .service-icon { font-size: 28px; margin-bottom: 20px; opacity: 0.7; }
        .service-name { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 16px; line-height: 1.2; }
        .service-desc { font-size: 13px; line-height: 1.75; color: var(--dim); font-weight: 300; }

        /* CTA */
        .cta-section-inner { text-align: center; }
        .waveform-deco { display: flex; align-items: center; gap: 3px; height: 24px; margin: 0 auto 48px; justify-content: center; }
        .waveform-deco span { display: block; width: 2px; background: linear-gradient(to top, var(--gold), transparent); border-radius: 2px; animation: waveform 1.4s ease-in-out infinite; }
        .cta-headline { font-size: clamp(36px, 5.5vw, 72px); font-weight: 700; line-height: 1.1; max-width: 640px; margin: 0 auto 48px; font-family: 'DM Sans', sans-serif; }
        .cta-headline em { font-style: italic; color: var(--gold-light); }
        .cta-actions { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .cta-email-link { font-size: 13px; letter-spacing: 0.1em; color: var(--dim); text-decoration: none; transition: color 0.3s; }
        .cta-email-link:hover { color: var(--gold); }

        footer { position: relative; z-index: 10; padding: 32px 10vw; border-top: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: 0.14em; color: var(--dim-light); text-transform: uppercase; }

        /* Animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
        .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.35; }
        @keyframes scrollPulse { 0% { left: -100%; } 100% { left: 100%; } }
        @keyframes waveform { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.3); } }
        @keyframes logoSpin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }

        .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.9s cubic-bezier(0.22,1,0.36,1), transform 0.9s cubic-bezier(0.22,1,0.36,1); }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.2s; }
        .reveal-delay-3 { transition-delay: 0.3s; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
            .logo-stage { display: none; }
            .logo-grid-fallback { display: grid !important; }
            #bgCanvas { opacity: 0.3; }
            .reveal { opacity: 1; transform: none; transition: none; }
        }

        @media (max-width: 768px) {
            nav { padding: 20px 6vw; }
            .nav-right a:not(.nav-pill) { display: none; }
            #hero { padding: 0 6vw; }
            section { padding: 80px 6vw; }
            .proof-grid, .services-grid { grid-template-columns: 1fr; }
            footer { flex-direction: column; gap: 12px; text-align: center; }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { heading: ['"DM Sans"','system-ui','sans-serif'], body: ['system-ui','-apple-system','sans-serif'] },
                    borderRadius: { DEFAULT: '9999px' },
                }
            }
        }
    </script>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div id="root"></div>

    <script type="text/babel">
        const { createRoot } = ReactDOM;
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion } = window.Motion;

        function BlurText({ text, className }) {
            const words = text.split(' ');
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current; if (!el) return;
                const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setVisible(true); obs.disconnect(); } }, { threshold: 0.1 });
                obs.observe(el); return () => obs.disconnect();
            }, []);
            return <p ref={ref} className={className||''} style={{display:'flex',flexWrap:'wrap',justifyContent:'flex-start',rowGap:'0.1em'}}>
                {words.map((w,i) => <motion.span key={i} style={{display:'inline-block',marginRight:'0.28em'}}
                    initial={{filter:'blur(10px)',opacity:0,y:50}}
                    animate={visible?[{filter:'blur(5px)',opacity:0.5,y:-5},{filter:'blur(0px)',opacity:1,y:0}]:{}}
                    transition={{duration:0.7,times:[0,0.5,1],ease:'easeOut',delay:(i*100)/1000}}>{w}</motion.span>)}
            </p>;
        }

        function Navbar() {
            return <nav>
                <img src="assets/outworld_logo_icon_white.png" alt="Outworld Creative logo" className="nav-logo-img" id="navLogo"
                    style={{ animation: 'logoSpin 24s linear infinite' }} />
                <div className="nav-right">
                    <a href="#logo-stage">Work</a>
                    <a href="#services">Services</a>
                    <a href="#final-cta" className="nav-pill">Start a Project</a>
                </div>
            </nav>;
        }

        function Hero() {
            useEffect(() => {
                const v = document.getElementById('heroVideo');
                if (!v) return;
                let prevX = 0, targetTime = null, queued = false;
                const onMove = (e) => {
                    if (window.innerWidth < 768) return;
                    const delta = (e.clientX - prevX) * 0.25;
                    prevX = e.clientX;
                    if (Math.abs(delta) < 2) return;
                    targetTime = Math.max(0, Math.min(v.duration || 12, (v.currentTime || 0) + delta));
                    if (!queued) { queued = true; requestAnimationFrame(() => { if (targetTime !== null) { v.currentTime = targetTime; targetTime = null; } queued = false; }); }
                };
                window.addEventListener('mousemove', onMove, { passive: true });
                return () => window.removeEventListener('mousemove', onMove);
            }, []);
            return <section id="hero">
                <video className="hero-video" muted playsinline preload="metadata"
                    poster="assets/video/outworld-cloud-portal-poster.jpg" aria-hidden="true"
                    id="heroVideo">
                    <source src="assets/video/outworld-cloud-portal-hero.webm" type="video/webm" />
                    <source src="assets/video/outworld-cloud-portal-hero.mp4" type="video/mp4" />
                </video>
                <div className="hero-eyebrow">Motion · Sound · Direction</div>
                <h1 className="hero-headline">Outworld Creative</h1>
                <BlurText text="Video ads and brand sound for brands people remember." className="hero-sub" />
                <p className="hero-micro">Short ads, campaign visuals and sound for Reels, TikTok and launches.</p>
                <div className="hero-cta">
                    <a href="mailto:team@outworldcreative.com" className="btn-primary">Request a Creative Diagnosis</a>
                    <span className="hero-email">or reach us at <a href="mailto:team@outworldcreative.com">team@outworldcreative.com</a></span>
                </div>
                <div className="scroll-indicator">
                    <span className="scroll-line"></span>
                    Scroll
                </div>
            </section>;
        }

        const ALL_LOGOS = [
            { src: "assets/brand/partners/adidas.webp", alt: "Adidas" },
            { src: "assets/brand/partners/sportscene.webp", alt: "Sportscene" },
            { src: "assets/brand/partners/kfc.webp", alt: "KFC" },
            { src: "assets/brand/partners/empire.webp", alt: "Empire" },
            { src: "assets/brand/partners/stem.webp", alt: "STEM" },
            { src: "assets/brand/partners/radical.webp", alt: "Radical" },
            { src: "assets/brand/partners/since-the-80s.webp", alt: "SinceThe80s" },
            { src: "assets/brand/partners/365.webp", alt: "365" },
            { src: "assets/brand/appearances/mtv.webp", alt: "MTV" },
            { src: "assets/brand/appearances/news24.webp", alt: "News24" },
            { src: "assets/brand/appearances/sabc.webp", alt: "SABC" },
            { src: "assets/brand/appearances/okayafrica.webp", alt: "OkayAfrica" },
            { src: "assets/brand/appearances/channelO.webp", alt: "Channel O" },
            { src: "assets/brand/appearances/trace.webp", alt: "Trace" },
            { src: "assets/brand/appearances/hnhh.webp", alt: "HNHH" },
        ];

        function LogoStage() {
            useEffect(() => {
                const card = document.getElementById('logoCard');
                const img = card?.querySelector('img');
                const stage = document.getElementById('logoStage');
                if (!card || !img || !stage) return;
                let current = 0, timer, paused = false;

                function flip() {
                    card.style.transition = 'opacity 500ms ease, transform 500ms ease';
                    card.style.opacity = '0';
                    card.style.transform = 'rotateY(-12deg)';
                    setTimeout(() => {
                        current = (current + 1) % ALL_LOGOS.length;
                        img.src = ALL_LOGOS[current].src;
                        img.alt = ALL_LOGOS[current].alt;
                        card.style.transform = 'rotateY(12deg)';
                        requestAnimationFrame(() => { card.style.opacity = '1'; card.style.transform = 'rotateY(0deg)'; });
                    }, 500);
                    if (!paused) timer = setTimeout(flip, 4000);
                }

                timer = setTimeout(flip, 4000);

                stage.addEventListener('click', () => { clearTimeout(timer); flip(); });
                stage.addEventListener('mouseenter', () => { paused = true; clearTimeout(timer); });
                stage.addEventListener('mouseleave', () => { paused = false; timer = setTimeout(flip, 2000); });

                const obs = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting) { paused = false; clearTimeout(timer); timer = setTimeout(flip, 1000); }
                    else { paused = true; clearTimeout(timer); }
                }, { threshold: 0.1 });
                obs.observe(stage);

                return () => { clearTimeout(timer); obs.disconnect(); };
            }, []);
            return <section id="logo-stage" className="logo-stage-container">
                <div className="section-label">Platforms, partners &amp; appearances</div>
                <h2 className="section-title">Creative work leaves<br/><em>a mark.</em></h2>
                <div className="logo-stage" id="logoStage" role="button" aria-label="Advance logo carousel" tabIndex="0">
                    <button className="logo-card" id="logoCard">
                        <img src={ALL_LOGOS[0].src} alt={ALL_LOGOS[0].alt} decoding="async" width="180" height="100" />
                    </button>
                </div>
                <div className="logo-grid-fallback">
                    {ALL_LOGOS.map((l,i) => <div key={i} className="logo-grid-item"><img src={l.src} alt={l.alt} decoding="async" width="80" height="40" /></div>)}
                </div>
            </section>;
        }

        const PROOF_CARDS = [
            { type:'video', title:'Product Launch Reel', desc:'15s hook-first structure for fashion brand.' },
            { type:'video', title:'Brand Sonic Identity', desc:'6s audio logo concept for tech startup.' },
            { type:'video', title:'Reels Campaign', desc:'3-part story arc for a beverage drop.' },
            { type:'visual', title:'Campaign Key Visual', desc:'Streetwear collection — minimal gold palette.' },
            { type:'visual', title:'Promo Graphics System', desc:'Social-first design for music release.' },
            { type:'visual', title:'Event Launch Identity', desc:'Bold, minimal, built for motion.' },
        ];

        function ProofSection() {
            return <section id="proof">
                <div className="section-label reveal">Proof of Work</div>
                <h2 className="section-title reveal reveal-delay-1">Direction you<br/>can <em>see.</em></h2>
                <div className="proof-grid reveal reveal-delay-2">
                    {PROOF_CARDS.map((c,i) => (
                        <div key={i} className="proof-card">
                            <div className="proof-thumb" style={{ background: `linear-gradient(${145+i*5}deg, #${['0a0a0a','080808','0a0806','060606','080808','06080a'][i]}, #${['10100a','100e06','0c0c0a','0e0c0a','0c0c0a','0a0c10'][i]}, #${['0a0a06','080808','0a0806','080606','080606','060608'][i]})` }}>
                                {c.type==='video'?<><div className="proof-thumb-icon">▶</div><div className="proof-thumb-lines"><span></span><span></span><span></span></div></>
                                :<div className="proof-thumb-icon" style={{opacity:0.1,fontSize:'48px'}}>{['◈','◉','◬'][i-3]}</div>}
                            </div>
                            <span className={`proof-tag ${c.type==='video'?'video-tag':''}`}>{c.type==='video'?'Video':'Visual'}</span>
                            <div className="proof-overlay">
                                <div className="proof-label">Spec Creative Direction — Outworld Creative</div>
                                <div className="proof-desc">{c.title} — {c.desc}</div>
                            </div>
                        </div>
                    ))}
                </div>
            </section>;
        }

        const SERVICES = [
            { num:'01', icon:'⬡', name:'Short-form Ads', desc:'Reels, TikToks and Shorts built around strong hooks. Every second earns the next one.' },
            { num:'02', icon:'♪', name:'Brand Sound', desc:'Jingles, tags and loops people remember. Sound that travels further than the screen.' },
            { num:'03', icon:'◈', name:'Campaign Direction', desc:'Ideas for launches, drops and promos. Strategy and creative working as one.' },
        ];

        function Services() {
            return <section id="services">
                <div className="section-label reveal">What We Do</div>
                <h2 className="section-title reveal reveal-delay-1">Three things.<br/><em>Done right.</em></h2>
                <div className="services-grid">
                    {SERVICES.map((s,i) => (
                        <div key={i} className={`service-card reveal reveal-delay-${i+1}`}>
                            <div className="service-num">{s.num}</div>
                            <div className="service-icon">{s.icon}</div>
                            <div className="service-name">{s.name}</div>
                            <p className="service-desc">{s.desc}</p>
                        </div>
                    ))}
                </div>
            </section>;
        }

        function FinalCTA() {
            return <section id="final-cta" className="cta-section-inner">
                <div className="cta-overline reveal reveal-delay-1" style={{fontSize:'10px',letterSpacing:'0.3em',textTransform:'uppercase',color:'var(--gold)',marginBottom:'32px'}}>Let's Work</div>
                <div className="waveform-deco reveal">
                    <span style={{height:'6px',animationDelay:'0s'}}></span>
                    <span style={{height:'14px',animationDelay:'0.1s'}}></span>
                    <span style={{height:'22px',animationDelay:'0.2s'}}></span>
                    <span style={{height:'18px',animationDelay:'0.3s'}}></span>
                    <span style={{height:'28px',animationDelay:'0.15s'}}></span>
                    <span style={{height:'20px',animationDelay:'0.25s'}}></span>
                    <span style={{height:'14px',animationDelay:'0.35s'}}></span>
                    <span style={{height:'8px',animationDelay:'0.05s'}}></span>
                </div>
                <h2 className="cta-headline reveal">Want <em>sharper</em><br/>ads?</h2>
                <div className="cta-actions reveal reveal-delay-1">
                    <a href="mailto:team@outworldcreative.com" className="btn-primary">Request a Creative Diagnosis</a>
                    <a href="mailto:team@outworldcreative.com" className="cta-email-link">team@outworldcreative.com</a>
                </div>
            </section>;
        }

        function Footer() {
            return <footer>
                <span>© 2026 Outworld Creative</span>
                <span>Motion · Sound · Direction</span>
                <span>Africa & Beyond</span>
            </footer>;
        }

        function App() {
            useEffect(() => {
                /* Scroll reveal */
                const obs = new IntersectionObserver(entries => {
                    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
                }, { threshold: 0.12 });
                document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
                return () => obs.disconnect();
            }, []);
            return <React.Fragment>
                <Navbar />
                <Hero />
                <div className="h-divider"></div>
                <LogoStage />
                <div className="h-divider"></div>
                <Services />
                <div className="h-divider"></div>
                <ProofSection />
                <div className="h-divider"></div>
                <FinalCTA />
                <Footer />
            </React.Fragment>;
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

    <script>
        /* ── CANVAS LIGHT-PATH BACKGROUND ── */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, mouse = { x: 0, y: 0 };

        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);
        document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

        class LightPath {
            constructor() { this.reset(); }
            reset() {
                this.x = W * (0.25 + Math.random() * 0.25);
                this.y = H * (0.3 + Math.random() * 0.4);
                this.angle = -Math.PI * (0.1 + Math.random() * 0.4);
                this.speed = 0.6 + Math.random() * 1.2;
                this.life = 0;
                this.maxLife = 220 + Math.random() * 300;
                this.curvature = (Math.random() - 0.5) * 0.018;
                this.width = 0.4 + Math.random() * 1.2;
                this.gold = Math.random() > 0.55;
                this.trail = [];
            }
            update(mouseInfluence) {
                this.angle += this.curvature;
                const pull = mouseInfluence * 0.00008;
                const dx = mouse.x - this.x, dy = mouse.y - this.y;
                if (Math.sqrt(dx * dx + dy * dy) < 300) this.angle += (Math.atan2(dy, dx) - this.angle) * pull;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.trail.push({ x: this.x, y: this.y, life: this.life });
                if (this.trail.length > 80) this.trail.shift();
                this.life++;
                if (this.life > this.maxLife || this.x < -100 || this.x > W + 100 || this.y < -100 || this.y > H + 100) this.reset();
            }
            draw() {
                if (this.trail.length < 2) return;
                const progress = this.life / this.maxLife;
                const fade = progress < 0.15 ? progress / 0.15 : progress > 0.75 ? 1 - (progress - 0.75) / 0.25 : 1;
                ctx.beginPath();
                ctx.moveTo(this.trail[0].x, this.trail[0].y);
                for (let i = 1; i < this.trail.length; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
                const color = this.gold ? `rgba(180,150,50,${fade * 0.7})` : `rgba(200,195,185,${fade * 0.18})`;
                ctx.strokeStyle = color;
                ctx.lineWidth = this.width * fade;
                ctx.lineCap = 'round';
                ctx.stroke();
                if (this.trail.length > 0) {
                    const tip = this.trail[this.trail.length - 1];
                    const g = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, this.gold ? 8 : 4);
                    if (this.gold) { g.addColorStop(0, `rgba(240,208,128,${fade * 0.9})`); g.addColorStop(1, 'rgba(201,168,76,0)'); }
                    else { g.addColorStop(0, `rgba(220,215,200,${fade * 0.4})`); g.addColorStop(1, 'rgba(220,215,200,0)'); }
                    ctx.beginPath(); ctx.arc(tip.x, tip.y, this.gold ? 8 : 4, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
                }
            }
        }

        class Node {
            constructor() {
                this.x = W * (0.08 + Math.random() * 0.84);
                this.y = H * (0.08 + Math.random() * 0.84);
                this.r = 0.5 + Math.random() * 1.5;
                this.alpha = 0.04 + Math.random() * 0.12;
                this.pulse = Math.random() * Math.PI * 2;
                this.speed = 0.008 + Math.random() * 0.015;
                this.gold = Math.random() > 0.7;
            }
            draw(t) {
                const a = this.alpha * (0.5 + 0.5 * Math.sin(this.pulse + t * this.speed));
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = this.gold ? `rgba(201,168,76,${a})` : `rgba(200,195,185,${a})`;
                ctx.fill();
            }
        }

        const paths = Array.from({ length: 22 }, () => new LightPath());
        const nodes = Array.from({ length: 60 }, () => new Node());
        let t = 0;

        function drawFrame() {
            ctx.clearRect(0, 0, W, H);
            const vign = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.9);
            vign.addColorStop(0, 'rgba(0,0,0,0)');
            vign.addColorStop(1, 'rgba(0,0,0,0.55)');
            ctx.fillStyle = vign;
            ctx.fillRect(0, 0, W, H);
            const mg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 280);
            mg.addColorStop(0, 'rgba(201,168,76,0.04)');
            mg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = mg;
            ctx.fillRect(0, 0, W, H);
            nodes.forEach(n => n.draw(t));
            paths.forEach(p => { p.update(1); p.draw(); });
            t++;
            requestAnimationFrame(drawFrame);
        }
        drawFrame();
    </script>
</body>
