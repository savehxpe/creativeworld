# Outreach Eval
description: "Checks Outworld outreach messages for clarity, authenticity, and ethical approach"
prompts:
  - "Write an Instagram DM to a restaurant owner offering a spec ad preview."
  - "Create a LinkedIn connection message to a fashion brand founder."
  - "Draft a cold email to a boutique hotel owner introducing creative direction services."
tests:
  - type: model-graded-closedqa
    rubric:
      - label: "direct"
        weight: 1
        test: "Is the message direct and clear? Not hiding the purpose behind fluff."
      - label: "shows-research"
        weight: 1
        test: "Does the message show evidence of looking at their actual brand? Not a copy-paste template."
      - label: "value-first"
        weight: 1
        test: "Does the message offer value before asking for anything? Not 'we can help you' but 'I noticed this.'"
      - label: "easy-to-say-yes"
        weight: 1
        test: "Is the CTA easy? 'Mind if I send it?' not 'Book a 30-minute call.'"
      - label: "no-pressure"
        weight: 1
        test: "Zero pressure tactics. No scarcity, no FOMO, no 'limited spots.'"
      - label: "no-fake-compliments"
        weight: 1
        test: "Are compliments specific and genuine? Not 'love your brand' without evidence."
      - label: "no-prices"
        weight: 0
        test: "Contains no pricing. FAIL if any price is mentioned."
      - label: "no-bots"
        weight: 0
        test: "Contains no 'AI,' 'bot,' or 'automation' language. FAIL if found."
    expected_score: 0.85
